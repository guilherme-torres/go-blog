{{define "title"}}Articles{{end}}

{{define "main"}}
<h1 class="mb-4">Articles</h1>
{{range .Articles}}
<div class="card mb-2">
    <div class="card-body">
        <div>
            <h3>{{.AuthorName}}</h3>
            <span>{{.PublishedAt}}</span>
        </div>
        <h2><a href="/articles/{{.ID}}">{{.Title}}</a></h2>
    </div>
</div>
{{end}}
{{end}}
